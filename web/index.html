<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FilledStacks Academy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>My Stacked Application</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <style>
    body {
      background-color: #0A0A0A;
      height: 100vh;
      width: 100vw;
      position: fixed;
      inset: 0px;
      overflow: hidden;
      padding: 0px;
      margin: 0px;
      user-select: none;
      touch-action: none;
    }

    /* Optional: Custom splash screen styles - remove if you don't want any loading indicator */
    .splash {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 100px;
    }

    .loading-text {
      color: #fff;
      font-family: system-ui, sans-serif;
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>

  <!-- Optional: Custom splash screen - remove this div if you want no loading indicator -->
  <div class="splash" id="splash">
    <img src="icons/Icon-512.png" alt="Logo" class="logo">
    <div class="loading-text"><h2>Loading...</h2></div>
  </div>

  <!-- Use the new bootstrap method with template tokens -->
  <!-- Remove the deprecated service worker version -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
  </script>
  <script>
    // Custom initialization with optional splash screen handling
    (function() {
      const splash = document.getElementById('splash');
      
      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          // Optional: Update loading text
          if (splash) {
            const textEl = splash.querySelector('.loading-text');
            if (textEl) textEl.textContent = 'Initializing...';
          }
          
          const appRunner = await engineInitializer.initializeEngine();
          
          // Remove splash screen before running app (or fade out)
          if (splash) {
            splash.style.transition = 'opacity 0.3s ease-out';
            splash.style.opacity = '0';
            setTimeout(() => {
              if (splash.parentNode) splash.remove();
            }, 300);
          }
          
          await appRunner.runApp();
        }
      });
    })();
  </script>
</body>

</html>
