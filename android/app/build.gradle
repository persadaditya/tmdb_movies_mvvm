plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}

// def flutterVersionName = localProperties.getProperty("flutter.versionName")
// if (flutterVersionName == null) {
//     flutterVersionName = "1.0"
// }

// def(major, minor, patch) = flutterVersionName.tokenize( '.' )
// def versionCodeGlobal = major.toInteger()*10000 + minor.toInteger()*100 + patch.toInteger()


android {
    namespace = "com.persadaditya.tmdbmovies"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.persadaditya.tmdbmovies"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        debug {
            storeFile = rootProject.file("debug.keystore")
        }
        release {
            storeFile = keyProperties["storeFile"] ? rootProject.file(keyProperties["storeFile"]) : null
            storePassword = keyProperties["storePassword"]
            keyPassword = keyProperties["keyPassword"]
            keyAlias = keyProperties["keyAlias"] 
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }

        release {
            // DONE: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.release
            shrinkResources false
            minifyEnabled false
            debuggable false
        }
    }
}

flutter {
    source = "../.."
}
